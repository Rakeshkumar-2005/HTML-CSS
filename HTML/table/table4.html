<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <table border="1">
    <caption>Table Example</caption>
    <thead>
    <tr>
      <th>column 1</th>
      <th>column 2</th>
      <th>column 3</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>row1 , cell1</td>
      <td>row1 , cell2</td>
      <td>row1 , cell3</td>
    </tr>
    <tr>
      <td>row2 , cell1</td>
      <td>row2 , cell2</td>
      <td>row2 , cell3</td>
    </tr>
    <tr>
      <td>row3 , cell1</td>
      <td>row3 , cell2</td>
      <td>row3 , cell3</td>
    </tr>
    </tbody>
    <tfoot>
      <tr>
      <th>column 1</th>
      <th>column 2</th>
      <th>column 3</th>
    </tr>
    </tfoot>
  </table>
</body>
</html>
