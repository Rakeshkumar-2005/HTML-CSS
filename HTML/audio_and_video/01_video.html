<!DOCTYPE html>
<html>
<head>
    <title>Video Example</title>
</head>
<body>

    <h3>Example: Adding a video to a web page in different supported types for different browsers</h3>

    <video controls>
        <source src="cn.mp4" type="video/mp4">
        <source src="cn.wmv" type="video/wmv">

        Your browser does not support the video tag.
    </video>

</body>
</html>
